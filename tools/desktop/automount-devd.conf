# FoxynBSD: devd(8) events for automount(8) (contrib/automount), which
# install-automount.sh installs as /usr/local/etc/devd/automount.conf.

# A USB stick or an SD card appears.
notify 100 {
	match "system" "DEVFS";
	match "type" "CREATE";
	match "cdev" "(da|mmcsd)[0-9]+.*";
	action "/usr/local/sbin/automount $cdev attach &";
};

# Its device nodes go away (on DragonFly, not while it is mounted).
notify 100 {
	match "system" "DEVFS";
	match "type" "DESTROY";
	match "cdev" "(da|mmcsd)[0-9]+.*";
	action "/usr/local/sbin/automount $cdev detach &";
};

# A USB mass storage device detaches: unmount what no longer reads.
detach 100 {
	device-name "umass[0-9]+";
	action "/usr/local/sbin/automount $device-name reap &";
};
