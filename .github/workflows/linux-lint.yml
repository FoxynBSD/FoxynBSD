name: Linux host scripts

# Fast checks of tools/linux (seconds, no build): the scripts parse under
# the shells Linux hosts use as /bin/sh (dash on Debian/Ubuntu, bash on
# Arch), shellcheck finds no errors, and the ELF audit still flags a
# Linux binary.  The builds are in linux-build.yml and linux-hosts.yml.

on:
  push:
    branches: [dev]
    paths:
      - 'tools/linux/**'
      - 'docs/hardware-report.md'
      - '.github/workflows/**'
      - 'stand/boot/dloader/cmds.c'
      - '.gitmodules'
      - 'contrib/**'
  pull_request:
    branches: [dev]
    paths:
      - 'tools/linux/**'
      - 'docs/hardware-report.md'
      - '.github/workflows/**'
      - 'stand/boot/dloader/cmds.c'
      - '.gitmodules'
      - 'contrib/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    name: Script checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse with dash and bash
        run: |
          # foxyn-install runs in the image, under DragonFly's sh.
          for f in tools/linux/*.sh tools/linux/foxyn-install; do
            dash -n "$f" && bash -n "$f" || { echo "::error file=$f::does not parse"; exit 1; }
          done

      - name: shellcheck (errors only)
        run: shellcheck -S error tools/linux/*.sh tools/linux/foxyn-install

      - name: Test hardware report redaction
        run: ruby tools/linux/tests/hardware-report-redact-test.rb

      # The contrib/ submodules: under contrib/, each with a
      # README.DRAGONFLY that records the commit the tree points to.
      - name: Check the submodule records
        run: tools/linux/check-submodules.sh

      # The boot menu logos (Wisdom, Fred): 16 lines of 33 columns, and
      # the colored variants draw the same characters as the plain one.
      - name: Check the boot menu logos
        run: tools/linux/check-logos.sh -p

      # The audit must fail on a glibc program and pass on an empty tree.
      - name: ELF audit self-test
        run: |
          mkdir -p /tmp/host/bin /tmp/empty
          cp /usr/bin/true /tmp/host/bin/
          if tools/linux/elf-audit.sh /tmp/host; then
            echo "::error::elf-audit.sh accepted a glibc program"; exit 1
          fi
          tools/linux/elf-audit.sh /tmp/empty
