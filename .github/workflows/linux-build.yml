name: Linux build

# Build the kernel, EFI loader and a minimal userland from a Linux host with
# tools/linux, then boot them under QEMU: kernel-only (to the mountroot
# prompt) and from a root image (to a shell).  See tools/linux/README.md.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OBJDIR: /home/runner/foxynbsd-obj
  BUILD_LOG: /home/runner/foxynbsd-build.log

defaults:
  run:
    shell: bash

jobs:
  kernel:
    name: Kernel, loader and boot tree
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison libfl-dev libbsd-dev libtirpc-dev \
            pkg-config qemu-system-x86 ovmf
          gcc --version | head -n1

      - name: Build host tools
        run: set -o pipefail; tools/linux/build.sh tools 2>&1 | tee -a "$BUILD_LOG"

      - name: Build kernel (X86_64_GENERIC)
        run: set -o pipefail; tools/linux/build.sh kernel 2>&1 | tee -a "$BUILD_LOG"

      - name: Build EFI loader
        run: set -o pipefail; tools/linux/build.sh loader 2>&1 | tee -a "$BUILD_LOG"

      - name: Assemble boot tree
        run: set -o pipefail; tools/linux/build.sh esp 2>&1 | tee -a "$BUILD_LOG"

      # Surface the end of the build log as an annotation, so the cause is
      # visible on the run page and through the API without the full log.
      - name: Report build failure
        if: failure()
        run: |
          [ -f "$BUILD_LOG" ] || exit 0
          # Compiler diagnostics first; fall back to the tail of the log.
          errs=$(grep -E ': (fatal )?error:|\*\*\* \[|^Error|terminated|Abort' "$BUILD_LOG" | sort -u | head -n 30 || :)
          [ -n "$errs" ] || errs=$(tail -n 20 "$BUILD_LOG")
          msg=$(printf '%s\n' "$errs" | cut -c1-400 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build failed::${msg}"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      # Kernel-only boot: passes when the kernel asks for a root
      # filesystem (there is no userland image yet).
      - name: Boot test under QEMU
        id: boot
        run: tools/linux/boot-test.sh

      # Identity (issues #2, #3): the loader and the kernel banner name
      # FoxynBSD.
      - name: Check the boot messages
        run: |
          log="$OBJDIR/qemu/X86_64_GENERIC.boot.log"
          grep -E 'FoxynBSD [^ ]+ #[0-9]+: ' "$log" ||
            { echo "::error title=Identity::the kernel banner does not say FoxynBSD"; exit 1; }
          # The loader draws its banner, menu and fox on the EFI console;
          # with QEMU headless little of it reaches the serial log, so
          # only report whether it did.
          if grep -aF 'Boot FoxynBSD' "$log" >/dev/null; then
            echo "::notice title=Identity::loader menu seen on the serial console"
          else
            echo "::notice title=Identity::loader menu not on the serial console (EFI console only)"
          fi

      - name: Report boot test result
        if: failure() && steps.boot.outcome == 'failure'
        run: |
          log="$OBJDIR/qemu/X86_64_GENERIC.boot.log"
          {
            cat "$log.fault" 2>/dev/null || :
            echo "--- serial tail ---"
            tail -n 60 "$log" 2>/dev/null || :
            echo "--- qemu stderr ---"
            cat "$log.stderr" 2>/dev/null || :
          } | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}' > /tmp/boot-tail
          echo "::warning title=QEMU boot test failed (serial tail)::$(cat /tmp/boot-tail)"

      - name: Upload boot tree and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foxynbsd-esp-X86_64_GENERIC
          path: |
            ${{ env.OBJDIR }}/esp/X86_64_GENERIC
            ${{ env.OBJDIR }}/qemu/*.log
            ${{ env.OBJDIR }}/qemu/*.stderr
          if-no-files-found: warn
          retention-days: 14

  modules:
    name: Kernel modules
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison libfl-dev libbsd-dev libtirpc-dev \
            pkg-config

      - name: Build kernel and modules
        run: set -o pipefail; tools/linux/build.sh modules 2>&1 | tee -a "$BUILD_LOG"

      # Surface the end of the build log as an annotation, so the cause is
      # visible on the run page and through the API without the full log.
      - name: Report build failure
        if: failure()
        run: |
          [ -f "$BUILD_LOG" ] || exit 0
          # Compiler diagnostics first; fall back to the tail of the log.
          errs=$(grep -E ': (fatal )?error:|\*\*\* \[|^Error|terminated|Abort' "$BUILD_LOG" | sort -u | head -n 30 || :)
          [ -n "$errs" ] || errs=$(tail -n 20 "$BUILD_LOG")
          msg=$(printf '%s\n' "$errs" | cut -c1-400 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build failed::${msg}"

  userland:
    name: Userland and boot to a shell
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison libfl-dev libbsd-dev libtirpc-dev \
            pkg-config clang lld xorriso fdisk \
            qemu-system-x86 ovmf
          clang --version | head -n1

      - name: Build host tools
        run: set -o pipefail; tools/linux/build.sh tools 2>&1 | tee -a "$BUILD_LOG"

      # Two filesystem modules that GENERIC does not have built in, for
      # the kldload test in the root image (the Kernel modules job builds
      # them all).
      - name: Build kernel, test modules, loader and boot tree
        env:
          MODULES_OVERRIDE: vfs/udf vfs/ext2fs
        run: |
          set -o pipefail
          { tools/linux/build.sh kernel && tools/linux/build.sh modules &&
            tools/linux/build.sh loader && tools/linux/build.sh esp; } 2>&1 |
            tee -a "$BUILD_LOG"

      - name: Build headers, libc and the base userland
        run: |
          set -o pipefail
          { tools/linux/build.sh sysroot && tools/linux/build.sh libc &&
            tools/linux/build.sh base; } 2>&1 | tee -a "$BUILD_LOG"

      # Identity (issue #4): FoxynBSD's macros exist next to DragonFly's.
      - name: Check the identity macros
        run: |
          printf '%s\n' '#include <sys/param.h>' \
            '#if !defined(__FoxynBSD__) || __FoxynBSD_version < 1' \
            '#error __FoxynBSD__ or __FoxynBSD_version missing' \
            '#endif' \
            '#if !defined(__DragonFly__) || !defined(__DragonFly_version)' \
            '#error __DragonFly__ or __DragonFly_version missing' \
            '#endif' 'int ok;' > /tmp/probe.c
          "$OBJDIR/host/bin/xcc" -c -o /tmp/probe.o /tmp/probe.c

      # The minimal image (the base programs); the Whole world job boots
      # the full one.
      - name: Build the root image
        env:
          ROOTFS: base
        run: set -o pipefail; tools/linux/build.sh rootfs 2>&1 | tee -a "$BUILD_LOG"

      # Host contamination: nothing in the image or the sysroot may be a
      # Linux object (ld-linux, glibc sonames or symbol versions, the
      # Linux ABI note).  The full report is in the artifact.
      - name: Audit the target ELF files
        run: |
          tools/linux/elf-audit.sh -o "$OBJDIR/elf-audit.txt" \
            "$OBJDIR/rootfs" "$OBJDIR/sysroot" ||
            { echo "::error title=ELF audit::$(grep '^ERROR' "$OBJDIR/elf-audit.txt" | head -n 20 | tr '\n' ';')"; exit 1; }

      - name: Report build failure
        if: failure()
        run: |
          [ -f "$BUILD_LOG" ] || exit 0
          errs=$(grep -E ': (fatal )?error:|\*\*\* \[|^Error|terminated|Abort|build.sh:' "$BUILD_LOG" | sort -u | head -n 30 || :)
          # The shell runs with pipefail: keep going when grep finds nothing.
          errs=$(printf '%s\n--- log tail ---\n%s\n' "$errs" "$(grep -v ' warning: ' "$BUILD_LOG" | tail -n 25)")
          msg=$(printf '%s\n' "$errs" | cut -c1-400 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Userland build failed::${msg}"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      # Passes when root has logged in on the serial console: init ran
      # /etc/rc from root.iso, went multi-user, and getty, login and PAM
      # let root into a shell.
      - name: Boot and log in under QEMU
        id: boot
        run: tools/linux/boot-test.sh --root

      # The checks of the boot log live in tools/linux/check-boot-log.sh,
      # shared with the other host distributions (linux-hosts.yml).
      # /etc/rc prints this only after dynamically linked programs ran.
      - name: Check that dynamically linked programs ran
        run: tools/linux/check-boot-log.sh rtld

      # Issue #9: the image runs the tree's /etc/rc and rc.d.  Commands
      # the scripts call but the image lacks are reported, not fatal.
      - name: Report commands rc.d could not find
        run: tools/linux/check-boot-log.sh rcd

      # Identity (issue #3): uname -s says DragonFly for compatibility,
      # uname -v and /etc/os-release name FoxynBSD.
      - name: Check the reported OS name
        run: tools/linux/check-boot-log.sh identity

      # Issue #9: a terminal database, a writable /tmp, login classes and
      # a password database.
      - name: Check terminfo, /tmp, login classes and users
        run: tools/linux/check-boot-log.sh basics

      # Issue #9: syslogd runs and logs what logger(1) sends it.
      - name: Check syslogd
        run: tools/linux/check-boot-log.sh syslogd

      # Issue #9: the daemons rc.d starts are still running after login.
      - name: Check running daemons
        run: tools/linux/check-boot-log.sh daemons

      - name: Check periodic daily
        run: tools/linux/check-boot-log.sh periodic

      # libgcc_eh and libstdc++ are built with clang: a static C++ test
      # throws through two frames and catches.
      - name: Check C++ exceptions
        run: tools/linux/check-boot-log.sh cxx

      # The compiler runtime is built from contrib/compiler-rt
      # (lib/libcompiler_rt): builtins in static and dynamic programs,
      # C++ constructors, destructors and exceptions across a shared
      # library, dlopen(3).
      - name: Check the compiler runtime and dynamic linking
        run: tools/linux/check-boot-log.sh runtime

      - name: Check permissions and writable directories
        run: tools/linux/check-boot-log.sh fs

      # Issue #5: the kernel runs binaries by either ABI note.
      - name: Check both ELF ABI notes
        run: tools/linux/check-boot-log.sh abi

      - name: Check loading kernel modules
        run: tools/linux/check-boot-log.sh kld

      # dhcpcd configures vtnet0 from QEMU's user-mode network, and
      # fetch(1) reaches a server QEMU answers for.
      - name: Check the network (dhcpcd)
        run: tools/linux/check-boot-log.sh net

      # LibreSSL in the base: fetch(1) over HTTPS to openssl s_server.
      - name: Check TLS (libcrypto, libssl)
        run: tools/linux/check-boot-log.sh tls

      # The same tree on a writable UFS disk (build.sh disk, makefs on
      # the host): it boots, the root is read-write, and halt -p shuts
      # it down cleanly.
      - name: Build the disk image
        env:
          ROOTFS: base
        run: set -o pipefail; tools/linux/build.sh disk 2>&1 | tee -a "$BUILD_LOG"

      - name: Boot the disk image
        id: disk
        run: |
          BOOT_LOG="$OBJDIR/qemu/disk-boot1.log" tools/linux/boot-test.sh --disk
          tools/linux/check-boot-log.sh -l "$OBJDIR/qemu/disk-boot1.log" \
            rtld basics daemons fs net tls disk

      # A second boot of the same disk finds what the first one wrote,
      # and a clean file system.
      - name: Boot the disk image again
        id: disk2
        run: |
          BOOT_LOG="$OBJDIR/qemu/disk-boot2.log" tools/linux/boot-test.sh --disk
          tools/linux/check-boot-log.sh -l "$OBJDIR/qemu/disk-boot2.log" \
            rtld basics fs disk persist

      # The installer: root.iso installs itself on an empty disk with
      # foxyn-install (GPT, FAT32 ESP with the loader and the kernel,
      # HAMMER2 root), and that disk then boots alone, from its own ESP.
      - name: Install with foxyn-install
        id: install
        run: |
          BOOT_LOG="$OBJDIR/qemu/install.log" tools/linux/boot-test.sh --install
          tools/linux/check-boot-log.sh -l "$OBJDIR/qemu/install.log" install

      - name: Boot the installed disk alone
        id: installed
        run: |
          BOOT_LOG="$OBJDIR/qemu/installed.log" tools/linux/boot-test.sh --installed
          tools/linux/check-boot-log.sh -l "$OBJDIR/qemu/installed.log" \
            rtld rcd basics daemons fs net tls disk

      - name: Report disk boot result
        if: always() && (steps.disk.outcome == 'failure' || steps.disk2.outcome == 'failure' || steps.install.outcome == 'failure' || steps.installed.outcome == 'failure')
        run: |
          for log in "$OBJDIR/qemu/disk-boot1.log" "$OBJDIR/qemu/disk-boot2.log" \
              "$OBJDIR/qemu/install.log" "$OBJDIR/qemu/installed.log"; do
            [ -f "$log" ] || continue
            {
              echo "--- $log ---"
              cat "$log.fault" 2>/dev/null || :
              tail -n 60 "$log" 2>/dev/null || :
              cat "$log.stderr" 2>/dev/null || :
            } | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}' > /tmp/boot-tail
            echo "::warning title=Disk boot (serial tail)::$(cat /tmp/boot-tail)"
          done

      - name: Report boot result
        if: always() && (steps.boot.outcome == 'failure' || steps.boot.outcome == 'success')
        run: |
          log="$OBJDIR/qemu/X86_64_GENERIC.boot-root.log"
          {
            cat "$log.fault" 2>/dev/null || :
            echo "--- serial tail ---"
            tail -n 60 "$log" 2>/dev/null || :
            echo "--- qemu stderr ---"
            cat "$log.stderr" 2>/dev/null || :
          } | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}' > /tmp/boot-tail
          echo "::notice title=Boot to a shell (${{ steps.boot.outcome }}), serial tail::$(cat /tmp/boot-tail)"

      - name: Upload root image and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foxynbsd-root-X86_64_GENERIC
          path: |
            ${{ env.OBJDIR }}/root.iso
            ${{ env.OBJDIR }}/elf-audit.txt
            ${{ env.OBJDIR }}/qemu/*.log
            ${{ env.OBJDIR }}/qemu/*.stderr
          if-no-files-found: warn
          retention-days: 14

  # build.sh world: every library and program directory, the toolchain
  # and share/, in buildworld's order.  KEEP_GOING=1 builds past a failed
  # directory, so one run reports all of them (and the job still fails).
  # Then what `tools/linux/build.sh` with no arguments makes (kernel,
  # loader, boot tree and a root image with the whole world) boots to a
  # root login, the default way to run the system.
  world:
    name: Whole world
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison libfl-dev libbsd-dev libtirpc-dev \
            pkg-config clang lld ncurses-bin xorriso qemu-system-x86 ovmf

      - name: Build host tools and headers
        run: |
          set -o pipefail
          { tools/linux/build.sh tools && tools/linux/build.sh sysroot; } 2>&1 |
            tee -a "$BUILD_LOG"

      # The full log is too large for the step output: keep it in a file,
      # print the step names, and report the failures below.
      - name: Build the world
        run: |
          set -o pipefail
          KEEP_GOING=1 tools/linux/build.sh world >> "$BUILD_LOG" 2>&1 ||
            { grep -A200 'these directories failed' "$BUILD_LOG"; exit 1; }
          grep -c '^>>> building' "$BUILD_LOG"

      - name: Build the kernel, loader, boot tree and full root image
        env:
          MODULES_OVERRIDE: vfs/udf vfs/ext2fs
        run: |
          set -o pipefail
          { tools/linux/build.sh kernel && tools/linux/build.sh modules &&
            tools/linux/build.sh; } >> "$BUILD_LOG" 2>&1 ||
            { tail -n 40 "$BUILD_LOG"; exit 1; }
          grep '^>>>' "$BUILD_LOG" | tail -n 6

      - name: Audit the target ELF files
        run: |
          tools/linux/elf-audit.sh -o "$OBJDIR/elf-audit.txt" "$OBJDIR/sysroot" "$OBJDIR/rootfs" ||
            { echo "::error title=ELF audit::$(grep '^ERROR' "$OBJDIR/elf-audit.txt" | head -n 20 | tr '\n' ';')"; exit 1; }

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Boot the full system and log in
        id: boot
        run: tools/linux/boot-test.sh --root

      - name: Check the boot log
        run: tools/linux/check-boot-log.sh all

      # The BSD Installer (usr.sbin/installer) on the image with the
      # whole world: logging in as "installer" starts it, and its front
      # end and back end show the welcome screen.  CI installs with
      # foxyn-install (the Userland job); the BSD Installer's menus are
      # walked by hand (tools/linux/README.md).
      - name: Start the BSD Installer
        run: |
          BOOT_LOG="$OBJDIR/qemu/bsdinstaller.log" tools/linux/boot-test.sh --bsdinstaller

      - name: Report boot result
        if: always() && (steps.boot.outcome == 'failure' || steps.boot.outcome == 'success')
        run: |
          log="$OBJDIR/qemu/X86_64_GENERIC.boot-root.log"
          {
            cat "$log.fault" 2>/dev/null || :
            echo "--- serial tail ---"
            tail -n 60 "$log" 2>/dev/null || :
            echo "--- qemu stderr ---"
            cat "$log.stderr" 2>/dev/null || :
          } | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}' > /tmp/boot-tail
          echo "::notice title=Full system boot (${{ steps.boot.outcome }}), serial tail::$(cat /tmp/boot-tail)"

      - name: Report build failure
        if: failure()
        run: |
          [ -f "$BUILD_LOG" ] || exit 0
          failed=$(sed -n '/these directories failed/,$p' "$BUILD_LOG" || :)
          errs=$(grep -E ': (fatal )?error:|\*\*\* \[|build.sh:' "$BUILD_LOG" | grep -v 'Wno-error' | sort -u | head -n 30 || :)
          errs=$(printf '%s\n--- errors ---\n%s\n' "$failed" "$errs")
          msg=$(printf '%s\n' "$errs" | cut -c1-400 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=World build failed::${msg}"

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foxynbsd-world-log
          path: |
            ${{ env.BUILD_LOG }}
            ${{ env.OBJDIR }}/elf-audit.txt
            ${{ env.OBJDIR }}/qemu/*.log
            ${{ env.OBJDIR }}/qemu/*.stderr
          if-no-files-found: warn
          retention-days: 14
