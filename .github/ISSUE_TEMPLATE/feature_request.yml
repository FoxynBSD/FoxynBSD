name: Feature or change proposal
description: Propose a feature, a new default, or a change to the system.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do that FoxynBSD does not support well today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Mention affected components.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
      description: Other approaches, and costs such as divergence from upstream DragonFly or ABI changes.
