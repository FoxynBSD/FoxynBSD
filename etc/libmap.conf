# libmap.conf(5): the run-time linker's library substitutions.
#
# FoxynBSD runs DragonFly BSD's packages (DPorts).  Some of them, pkg(8)
# among them, are linked against DragonFly's private LibreSSL in the base
# (/usr/lib/priv), whose library versions FoxynBSD's newer LibreSSL
# replaced.  Load FoxynBSD's instead.
libprivate_crypto.so.50	libprivate_crypto.so.57
libprivate_ssl.so.53	libprivate_ssl.so.60
