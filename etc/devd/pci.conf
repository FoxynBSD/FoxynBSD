#
# Drivers for PCI devices that no driver in the kernel claimed, loaded
# when devd(8) gets the device's nomatch event (at boot too: the kernel
# queues the events until devd reads them).  Matched by PCI class, as
# pciconf(8) prints it.
#

# High Definition Audio controllers (class 0x04, subclass 0x03): the
# sound card of nearly every PC since 2004.
nomatch 32 {
	match "bus" "pci[0-9]+";
	match "class" "0x0403[0-9a-f][0-9a-f]";
	action "kldload -n snd_hda";
};
